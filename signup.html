<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Study Planner</title>
  <link rel="stylesheet" href="signup.css">
  <script src="register.js" defer></script>
</head>

<body>
  <div id="container">
    <h1>Create account ✨</h1>
    <p class="sub">Start organizing your classes and activities.</p>

    <label for="username">Username</label>
    <input id="username" type="text" placeholder="Choose a username" autocomplete="username">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="At least 6 characters" autocomplete="new-password">

    <p id="content" aria-live="polite"></p>

    <button id="create" type="button">Create Account</button>
    <button id="login" class="text-btn" type="button">Already have an account? Log in</button>
  </div>
</body>

</html>
